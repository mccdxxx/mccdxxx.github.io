name: Direct import check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/direct-import-check.yml'

permissions:
  issues: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect transport slices
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request, hashlib
          u='https://api.github.com/repos/N4k2i/about-naki.github.io/issues/2/comments?per_page=100'
          req=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          cs=json.load(urllib.request.urlopen(req))
          for c in cs:
              b=c.get('body','')
              m=re.match(r'DIRECT_SOURCE_PART\s+(\d+)/\d+\n(.*)\Z',b,re.S)
              if m:
                  p=m.group(2).strip()
                  print(f"PART {int(m.group(1)):02d} LEN {len(p)} SHA {hashlib.sha256(p.encode()).hexdigest()} ID {c['id']}")
          PY
