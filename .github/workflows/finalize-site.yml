name: Finalize site import

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/finalize-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect payload archive prefix
        shell: bash
        run: |
          set -u
          cat .bootstrap/part-00 .bootstrap/part-01 .bootstrap/part-02 .bootstrap/part-03 > /tmp/site.b64
          base64 --decode /tmp/site.b64 > /tmp/site.partial.xz
          xz -dc /tmp/site.partial.xz > /tmp/site.partial.tar 2>/dev/null || true
          echo 'FIRST TAR ENTRIES:'
          tar -tvf /tmp/site.partial.tar --ignore-zeros 2>/dev/null | head -35 || true
          echo 'FIRST 512 TAR BYTES:'
          head -c 512 /tmp/site.partial.tar | base64 -w0
          echo
