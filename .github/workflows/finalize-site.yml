name: Finalize site import

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/finalize-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct full Jekyll site
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/site.tar.xz
          for part in .bootstrap/part-*; do
            base64 --decode "$part" >> /tmp/site.tar.xz
          done
          xz --test /tmp/site.tar.xz
          mkdir -p /tmp/site
          tar -xJf /tmp/site.tar.xz -C /tmp/site
          test -f /tmp/site/_config.yml
          test -d /tmp/site/_arg
          test -d /tmp/site/_arg_mature
          test "$(find /tmp/site -type f | wc -l)" -eq 588
          grep -q '^url: https://n4k2i.github.io$' /tmp/site/_config.yml
          grep -q '^baseurl: /about-naki.github.io$' /tmp/site/_config.yml

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/site/. .

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: deploy complete Outside the Noise ARG site"
          git push origin HEAD:main
