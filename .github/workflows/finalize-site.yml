name: Finalize site import

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/manifest.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and reconstruct complete site
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/manifest.txt
          cat .bootstrap/part-* > /tmp/site.b64
          base64 --decode /tmp/site.b64 > /tmp/site.xz
          xz -t /tmp/site.xz
          xz -dc /tmp/site.xz > /tmp/site.tar
          test "$(tar -tf /tmp/site.tar | wc -l)" -ge 589
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.bootstrap' ! -name '.github' -exec rm -rf {} +
          tar -xf /tmp/site.tar
          rm -rf .bootstrap
          rm -f .github/workflows/finalize-site.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: deploy complete Outside the Noise site'
          git push origin HEAD:main
