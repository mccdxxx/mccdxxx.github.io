name: Finalize site import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and commit complete site
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-00 .bootstrap/part-01 .bootstrap/part-02 .bootstrap/part-03 .bootstrap/part-04 > /tmp/site.b64
          base64 --decode /tmp/site.b64 > /tmp/site.xz
          xz -dc /tmp/site.xz > /tmp/site.tar
          tar -xf /tmp/site.tar
          rm -rf .bootstrap
          rm -f .github/workflows/finalize-site.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: deploy complete Outside the Noise site'
          git push origin HEAD:main
